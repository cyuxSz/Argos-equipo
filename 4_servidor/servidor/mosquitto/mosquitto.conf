# --- Puerto MQTT para los nodos ---
listener 1883
# Se exige usuario y contrasena
allow_anonymous false
# Usuarios (contrasenas guardadas como hash) y permisos por topic
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Guarda en disco los mensajes retenidos (el "estado" de cada nodo)
persistence true
persistence_location /mosquitto/data/

# Puerto WebSocket para el dashboard en el navegador (lo expone nginx en /mqtt)
listener 9001
protocol websockets
