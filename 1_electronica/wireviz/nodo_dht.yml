# GENERADO por generar_wireviz.py desde layouts.py (nodo_dht). No editar a mano.
metadata:
  title: Argos - nodo dht
  notes: "Borrador. Componentes en la protoboard: hardware/breadboard/nodo_dht_protoboard.md"
connectors:
  PB:
    type: "Protoboard 400 pts + NodeMCU Amica"
    subtype: puntos de conexion (ver dibujo de protoboard)
    pinlabels:
      - "LED_V (a20)"
      - "GND (A_GND:19)"
      - "LED_R (a22)"
      - "GND (A_GND:23)"
      - "D6 (j21)"
      - "GND (J_GND:7)"
      - "3V3 (J_3V3:25)"
      - "DATA (f24)"
      - "GND (J_GND:25)"
      - "5V (A_5V:30)"
      - "COLECTOR (a28)"
      - "3V3 (J_3V3:12)"
      - "GND (J_GND:12)"
      - "SCL (f25)"
      - "SDA (f23)"
  LED_V:
    type: "LED 5 mm verde (tapa, izquierda)"
    pinlabels: ["A", "K"]
  LED_R:
    type: "LED 5 mm rojo (tapa, derecha)"
    pinlabels: ["A", "K"]
  Boton:
    type: "Pulsador 6x6 del kit (tapa)"
    pinlabels: ["1", "2"]
  DHT22:
    type: "DHT22 (camara inferior)"
    pinlabels: ["VCC", "DATA", "GND"]
  Buzzer:
    type: "Buzzer activo KY-012 (pinout POR CONFIRMAR)"
    pinlabels: ["+", "-"]
  OLED:
    type: "OLED 2.42\" SSD1309 I2C (4 pines)"
    pinlabels: ["VCC", "GND", "SCL", "SDA"]
cables:
  W_LED_V:
    wirecount: 2
    colors: [GN, BK]
    length: 0.15
    type: "Dupont M-H"
  W_LED_R:
    wirecount: 2
    colors: [RD, BK]
    length: 0.15
    type: "Dupont M-H"
  W_Boton:
    wirecount: 2
    colors: [GY, BK]
    length: 0.15
    type: "Dupont M-H"
  W_DHT22:
    wirecount: 3
    colors: [OG, YE, BK]
    length: 0.2
    type: "Dupont M-H"
  W_Buzzer:
    wirecount: 2
    colors: [RD, WH]
    length: 0.15
    type: "Dupont M-H"
  W_OLED:
    wirecount: 4
    colors: [OG, BK, BU, GN]
    length: 0.15
    type: "Dupont M-H"
connections:
  - - PB: [1, 2]
    - W_LED_V: [1-2]
    - LED_V: ["A", "K"]
  - - PB: [3, 4]
    - W_LED_R: [1-2]
    - LED_R: ["A", "K"]
  - - PB: [5, 6]
    - W_Boton: [1-2]
    - Boton: ["1", "2"]
  - - PB: [7, 8, 9]
    - W_DHT22: [1-3]
    - DHT22: ["VCC", "DATA", "GND"]
  - - PB: [10, 11]
    - W_Buzzer: [1-2]
    - Buzzer: ["+", "-"]
  - - PB: [12, 13, 14, 15]
    - W_OLED: [1-4]
    - OLED: ["VCC", "GND", "SCL", "SDA"]
