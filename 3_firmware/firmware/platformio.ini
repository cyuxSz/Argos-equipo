; Argos - firmware de referencia (SOLO COMPILAR; no usar "-t upload" sin aprobacion)
; Compilar:  ~/.local/bin/pio run -d firmware -e dht   (Arduino IDE: docs/arduino_ide.md)
; Credenciales: copiar include/secrets.example.h a include/secrets.h (no versionado).

[platformio]
default_envs = dht

[env]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5

; Nodo dht con OLED 2.42" SSD1309 I2C (variante adoptada): DHT22 en D4
[env:dht]
build_src_filter = +<dht/>
build_flags = -D NODO_ID=\"dht\" -D USAR_OLED=1
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
    olikraus/U8g2@2.35.30

; Respaldo sin pantalla: DHT22 en D2
[env:dht_sin_oled]
build_src_filter = +<dht/>
build_flags = -D NODO_ID=\"dht\" -D USAR_OLED=0
lib_deps =
    ${env.lib_deps}
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14

[env:luz]
build_src_filter = +<luz/>
build_flags = -D NODO_ID=\"luz\" -D USAR_RELES=0

; Submódulo opcional del fotoperiodo (docs/caja_potencia_luz.md): mismo nodo luz + relés en D1/D2/D5
[env:luz_rele]
build_src_filter = +<luz/>
build_flags = -D NODO_ID=\"luz\" -D USAR_RELES=1

[env:pir]
build_src_filter = +<pir/>
build_flags = -D NODO_ID=\"pir\"

[env:puerta]
build_src_filter = +<puerta/>
build_flags = -D NODO_ID=\"puerta\"

[env:acel]
build_src_filter = +<acel/>
build_flags = -D NODO_ID=\"acel\"
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ADS1X15@2.5.0
    adafruit/Adafruit BusIO@1.16.1
